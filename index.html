<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>一个魂的试炼 1.1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: #1a1a2e;
      display: flex; justify-content: center; align-items: center;
      height: 100vh; height: 100dvh;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block; cursor: default;
      max-width: 100vw; max-height: 100dvh;
      touch-action: none;
    }
    #boot {
      position: fixed; inset: 0; z-index: 9;
      display: flex; align-items: center; justify-content: center;
      background: #1a1a2e; color: #ffd700;
      font: 16px 微软雅黑, system-ui, sans-serif;
      white-space: pre-line; text-align: center; padding: 24px;
    }
    #boot.hide { display: none; }
    #boot.error { color: #e74c3c; }
  </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>
<div id="boot">加载中…</div>
<script>
  window.__bootFail = function (msg) {
    var b = document.getElementById('boot');
    if (!b) return;
    b.textContent = '加载失败：' + msg + '\n请确认是通过 http 访问（双击 dev.bat），不要直接打开 index.html';
    b.className = 'error';
  };
  window.addEventListener('error', function (e) { window.__bootFail(e.message); });
</script>
<script type="module" src="src/main.js?v=1.1"></script>
</body>
</html>
